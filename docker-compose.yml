version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: garimpo-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=garimpo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d garimpo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: garimpo-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=garimpo_db;Username=user;Password=password
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    container_name: garimpo-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081" # Metro Bundler port
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=host.docker.internal

volumes:
  postgres_data:
    driver: local
