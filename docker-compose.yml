services:
  db:
    image: postgres:16-alpine
    container_name: garimpo-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: garimpo-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=${DB_PORT:-5432};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Security__Jwt__Secret: ${Security__Jwt__Secret}
      Security__Jwt__Issuer: ${Security__Jwt__Issuer:-GarimpoEspacial}
      Security__Jwt__Audience: ${Security__Jwt__Audience:-GarimpoEspacialApp}
      Security__Jwt__ExpirationHours: ${Security__Jwt__ExpirationHours:-24}
      Security__AllowedOrigins__0: http://localhost:8081
      Security__AllowedOrigins__1: http://localhost:19000
      Security__AllowedOrigins__2: http://localhost:19001
      Security__AllowedOrigins__3: http://localhost:19002
      ExternalServices__Celestrak__BaseUrl: ${ExternalServices__Celestrak__BaseUrl}
      ExternalServices__Celestrak__DefaultGroup: ${ExternalServices__Celestrak__DefaultGroup:-cosmos-2251-debris}
      ExternalServices__SpaceTrack__Username: ${ExternalServices__SpaceTrack__Username:-}
      ExternalServices__SpaceTrack__Password: ${ExternalServices__SpaceTrack__Password:-}

  frontend:
    container_name: garimpo-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: host.docker.internal
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}

volumes:
  postgres_data:
    driver: local
